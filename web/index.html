<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Oohra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Forum&family=Spectral:ital,wght@0,300;0,400;0,500;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a dark page that is mostly fog. A pixel mist drifts behind everything and thins around the pointer, exposing ghost syllables.
   Sections are asymmetric: a narrow label column with a pixel sign on the left, the content on the right.
   The development progress is drawn as an island in fog of war: the more is finished, the more of it is revealed. */
:root{
  --bg:#080b09;--bg2:#0e1310;--fg:#d6d3c4;--dim:#8a9486;--line:#1f2923;
  --lichen:#b8c64c;--lichen-fg:#0b0f06;--blood:#a2402c;--mist:#2b3a33;--ghost:#b8c64c;
  --m-deep:#0b1416;--m-shallow:#112326;--m-sand:#4a4a37;--m-grass:#29402a;--m-forest:#1a3220;--m-rock:#494b46;--m-fog:#060908;--m-fog2:#0c120e;
  --display:'Forum',Georgia,'Times New Roman',serif;--body:'Spectral',Georgia,serif;--mono:'IBM Plex Mono',ui-monospace,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --bg:#dde1d6;--bg2:#e8ebe1;--fg:#12170f;--dim:#4a5446;--line:#bcc3b1;
  --lichen:#4c5b0c;--lichen-fg:#f3f6e6;--blood:#8f2f1d;--mist:#f6f8ef;--ghost:#3d4a0a;
  --m-deep:#9bb3b1;--m-shallow:#b3c6c0;--m-sand:#cdc8a6;--m-grass:#96ad85;--m-forest:#728e6c;--m-rock:#a6a89f;--m-fog:#c7cbbc;--m-fog2:#d2d6c8;color-scheme:light}}
:root[data-theme="light"]{
  --bg:#dde1d6;--bg2:#e8ebe1;--fg:#12170f;--dim:#4a5446;--line:#bcc3b1;
  --lichen:#4c5b0c;--lichen-fg:#f3f6e6;--blood:#8f2f1d;--mist:#f6f8ef;--ghost:#3d4a0a;
  --m-deep:#9bb3b1;--m-shallow:#b3c6c0;--m-sand:#cdc8a6;--m-grass:#96ad85;--m-forest:#728e6c;--m-rock:#a6a89f;--m-fog:#c7cbbc;--m-fog2:#d2d6c8;color-scheme:light}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font:19px/1.62 var(--body);margin:0;padding-inline:16px;padding-block:0 40px}
p{margin:0}
a{color:inherit}
#fog{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;display:block}
.page{position:relative;z-index:1;max-width:1120px;margin:0 auto}
.mono{font:500 11.5px/1.3 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance}
h1{font-size:clamp(42px,9.4vw,108px);line-height:.98;letter-spacing:-.012em}
h2{font-size:clamp(30px,5vw,48px);line-height:1.06}
h3{font-size:24px;line-height:1.15}
:focus-visible{outline:2px solid var(--lichen);outline-offset:3px}

/* header */
.bar{position:static;z-index:5;display:flex;flex-wrap:wrap;gap:8px 26px;align-items:center;justify-content:space-between;padding-block:14px;background:color-mix(in srgb,var(--bg) 86%,transparent)}
.mark{font:400 24px/1 var(--display);letter-spacing:.06em;text-transform:uppercase}
.bar nav{display:flex;flex-wrap:wrap;gap:2px 22px;font:500 11.5px var(--mono);letter-spacing:.14em;text-transform:uppercase}
.bar nav a{text-decoration:none;color:var(--dim);padding-block:6px}
.bar nav a:hover{color:var(--lichen)}
.lang{display:flex;border:1px solid var(--line)}
.lang button{font:500 11.5px var(--mono);letter-spacing:.14em;background:transparent;color:var(--dim);border:0;padding:7px 11px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--lichen);color:var(--lichen-fg)}

@media(min-width:900px){.bar{position:sticky;top:env(safe-area-inset-top,0px)}}
/* hero */
.hero{padding-block:clamp(70px,14vw,170px) clamp(70px,11vw,130px);display:flex;flex-direction:column;gap:30px;max-width:860px;min-width:0}
.hero h1 em{font-style:normal;color:var(--lichen)}
.lede{font-size:clamp(20px,2.6vw,25px);line-height:1.5;max-width:30em;color:var(--fg);font-weight:300}
.cta{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.btn{font:500 12.5px var(--mono);letter-spacing:.14em;text-transform:uppercase;background:var(--lichen);color:var(--lichen-fg);text-decoration:none;padding:14px 20px;display:inline-block}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--lichen);color:var(--lichen)}
.soon{color:var(--dim);font-size:17px;font-style:italic}
.hint{color:var(--dim);font:500 11px var(--mono);letter-spacing:.14em;text-transform:uppercase;opacity:.8}

/* asymmetric sections */
.sec{border-top:1px solid var(--line);padding-block:clamp(54px,8vw,96px);display:grid;grid-template-columns:1fr;gap:28px 40px;min-width:0}
@media(min-width:900px){.sec{grid-template-columns:200px minmax(0,1fr)}}
.lab{display:flex;flex-direction:row;align-items:center;gap:14px}
@media(min-width:900px){.lab{flex-direction:column;align-items:flex-start;gap:18px;position:sticky;top:76px;align-self:start}}
.lab svg{width:44px;height:44px;flex:none;display:block}
.body{display:flex;flex-direction:column;gap:34px;min-width:0}
.head{display:flex;flex-direction:column;gap:14px;max-width:36em}
.head p{color:var(--dim)}
.list{display:grid;grid-template-columns:1fr;gap:28px 44px}
@media(min-width:700px){.list{grid-template-columns:1fr 1fr}}
.it{display:flex;flex-direction:column;gap:8px;min-width:0;padding-left:18px;border-left:1px solid var(--line)}
.it p{color:var(--dim)}
.it p b{color:var(--fg);font-weight:500}

/* generations */
.duo{display:grid;grid-template-columns:1fr;gap:22px}
@media(min-width:700px){.duo{grid-template-columns:1fr 1fr}}
.side{display:flex;flex-direction:column;gap:14px;min-width:0}
.side h3{display:flex;flex-direction:column;gap:6px}
.side ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:9px}
.side li{display:flex;gap:12px;color:var(--dim);align-items:baseline}
.side li::before{content:"";flex:none;width:6px;height:6px;background:var(--c);transform:translateY(-2px)}
.side.a{--c:var(--blood)}.side.b{--c:var(--lichen)}
.side.a .mono{color:var(--blood)}.side.b .mono{color:var(--lichen)}
.side .pic{height:150px;display:block;width:100%}

/* signs */
.glyphs{display:grid;grid-template-columns:repeat(2,1fr);gap:20px}
@media(min-width:700px){.glyphs{grid-template-columns:repeat(4,1fr)}}
.gl{display:flex;flex-direction:column;gap:10px;min-width:0}
.gl svg{width:100%;max-width:170px;height:auto;display:block;background:var(--bg2);border:1px solid var(--line)}
details{border-top:1px solid var(--line);padding-top:8px}
summary{cursor:pointer;color:var(--lichen);font:500 11.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;list-style:none}
summary::-webkit-details-marker{display:none}
summary::after{content:" +"}
details[open] summary::after{content:" -"}
details p{color:var(--dim);font-size:17px;padding-top:8px}
.syl{display:flex;flex-wrap:wrap;gap:8px}
.syl span{font:500 19px var(--mono);border:1px solid var(--line);padding:6px 14px;background:var(--bg2)}

/* progress */
.score{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 18px}
.score b{font:400 clamp(56px,10vw,104px)/.9 var(--display);color:var(--lichen)}
.mapbox{position:relative;border:1px solid var(--line);background:var(--m-fog);min-width:0}
#map{display:block;width:100%;height:auto;image-rendering:pixelated}
.legend{display:flex;flex-wrap:wrap;gap:6px 22px;margin-top:10px}
.segs{display:flex;gap:3px;margin-top:6px}
.seg{height:14px;border:1px solid var(--line);position:relative;min-width:6px}
.seg i{position:absolute;inset:0 auto 0 0;background:var(--lichen);display:block}
.segl{display:flex;gap:3px;margin-top:6px}
.segl span{font:500 11.5px var(--mono);color:var(--dim);letter-spacing:.08em;min-width:6px;overflow:hidden}
.road{list-style:none;margin:0;padding:0}
.road li{display:grid;grid-template-columns:34px 1fr;gap:2px 14px;border-top:1px solid var(--line);padding-block:14px;align-items:baseline}
.road .k{font:400 28px/1 var(--display);color:var(--dim)}
.road .now .k{color:var(--lichen)}
.road .done .k{color:var(--fg)}
.road .t{display:flex;flex-direction:column;min-width:0}
.road .t small{color:var(--dim);font-size:16.5px}
.road .s{grid-column:2;font:500 11px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.road .now .s{color:var(--lichen)}
@media(min-width:700px){.road li{grid-template-columns:34px 1fr 150px}.road .s{grid-column:auto;text-align:right}}

/* journal */
.log{display:flex;flex-direction:column}
.entry{display:grid;grid-template-columns:1fr;gap:6px 30px;border-top:1px solid var(--line);padding-block:22px}
@media(min-width:700px){.entry{grid-template-columns:150px minmax(0,1fr)}}
.entry .tx{display:flex;flex-direction:column;gap:8px;max-width:38em;min-width:0}
.entry .tx p{color:var(--dim)}
.entry img{display:block;max-width:100%;height:auto;border:1px solid var(--line);margin-top:6px}
.entry.empty{opacity:.9}
.entry.empty h3{color:var(--dim);font-style:italic}

/* fragments */
.plates{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
@media(min-width:760px){.plates{grid-template-columns:repeat(3,1fr)}}
.plate{margin:0;display:flex;flex-direction:column;gap:8px;min-width:0}
.plate .fr{aspect-ratio:4/3;width:100%;border:1px solid var(--line);background:var(--bg2);display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.plate img{width:100%;height:100%;object-fit:cover;display:block}
.plate .fr svg{width:34%;height:auto;opacity:.18}
.plate figcaption{color:var(--dim);font-size:16px}
footer{border-top:1px solid var(--line);padding-block:30px;display:flex;flex-wrap:wrap;gap:8px 32px;justify-content:space-between;color:var(--dim);font-size:16px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>

</head>
<body>
<canvas id="fog" aria-hidden="true"></canvas>

<div class="page">
  <header class="bar">
    <div class="mark" data-name>Oohra</div>
    <nav aria-label="Menu">
      <a href="#hra" data-i="nav_game">Hra</a><a href="#generace" data-i="nav_gen">Generace</a><a href="#tajemstvi" data-i="nav_mys">Tajemství</a><a href="#postup" data-i="nav_prog">Postup</a><a href="#denik" data-i="nav_log">Deník</a>
    </nav>
    <div class="lang" role="group" aria-label="Jazyk / Language"><button type="button" data-lang="cs" aria-pressed="true">CS</button><button type="button" data-lang="en" aria-pressed="false">EN</button></div>
  </header>

  <div class="hero">
    <div class="mono" data-i="eyebrow">Hra o přežití · jeden trvalý svět · ve vývoji</div>
    <h1 id="h1"></h1>
    <p class="lede" data-i="lede"></p>
    <div class="cta">
      <a class="btn" href="#postup" data-i="cta1">Sledovat postup</a>
      <a class="btn ghost" href="#denik" data-i="cta2">Číst zápisy</a>
      <a class="btn ghost" id="lnkDemo" href="#" hidden data-i="demo">Zahrát si ukázku</a>
      <a class="btn ghost" id="lnkDiscord" href="#" hidden>Discord</a>
    </div>
    <p class="soon" id="soon" data-i="soon"></p>
    <p class="hint" data-i="hint"></p>
  </div>

  <section class="sec" id="hra">
    <div class="lab"><svg data-sign="0" aria-hidden="true"></svg><div class="mono" data-i="nav_game">Hra</div></div>
    <div class="body">
      <div class="head"><h2 data-i="game_h"></h2><p data-i="game_p"></p></div>
      <div class="list" id="rules"></div>
    </div>
  </section>

  <section class="sec" id="generace">
    <div class="lab"><svg data-sign="1" aria-hidden="true"></svg><div class="mono" data-i="nav_gen">Generace</div></div>
    <div class="body">
      <div class="head"><h2 data-i="gen_h"></h2><p data-i="gen_p"></p></div>
      <div class="duo">
        <div class="side a"><svg class="pic" data-body="old" viewBox="0 0 120 150" aria-hidden="true"></svg><h3><span class="mono" data-i="gen_a_tag"></span><span data-i="gen_a"></span></h3><ul id="listA"></ul></div>
        <div class="side b"><svg class="pic" data-body="new" viewBox="0 0 120 150" aria-hidden="true"></svg><h3><span class="mono" data-i="gen_b_tag"></span><span data-i="gen_b"></span></h3><ul id="listB"></ul></div>
      </div>
    </div>
  </section>

  <section class="sec" id="tajemstvi">
    <div class="lab"><svg data-sign="2" aria-hidden="true"></svg><div class="mono" data-i="nav_mys">Tajemství</div></div>
    <div class="body">
      <div class="head"><h2 data-i="mys_h"></h2><p data-i="mys_p"></p></div>
      <div class="glyphs" id="glyphs"></div>
      <div class="head" style="gap:14px">
        <div class="mono" data-i="syl_h"></div>
        <div class="syl" id="syl"></div>
        <p data-i="syl_p"></p>
      </div>
    </div>
  </section>

  <section class="sec" id="postup">
    <div class="lab"><svg data-sign="3" aria-hidden="true"></svg><div class="mono" data-i="nav_prog">Postup</div></div>
    <div class="body">
      <div class="head"><h2 data-i="prog_h"></h2><p data-i="prog_p"></p></div>
      <div class="score"><b id="pct">0 %</b><span class="mono" data-i="prog_rev"></span></div>
      <div>
        <div class="mapbox"><canvas id="map" width="720" height="360" role="img"></canvas></div>
        <div class="legend"><span class="mono" data-i="prog_leg"></span></div>
      </div>
      <div>
        <div class="segs" id="segs" role="img"></div>
        <div class="segl" id="segl" aria-hidden="true"></div>
      </div>
      <ol class="road" id="road"></ol>
    </div>
  </section>

  <section class="sec" id="denik">
    <div class="lab"><svg data-sign="0" aria-hidden="true"></svg><div class="mono" data-i="nav_log">Deník</div></div>
    <div class="body">
      <div class="head"><h2 data-i="log_h"></h2><p data-i="log_p"></p></div>
      <div class="log" id="log"></div>
    </div>
  </section>

  <section class="sec" id="fragmenty">
    <div class="lab"><svg data-sign="2" aria-hidden="true"></svg><div class="mono" data-i="nav_frag">Fragmenty</div></div>
    <div class="body">
      <div class="head"><h2 data-i="frag_h"></h2><p data-i="frag_p"></p></div>
      <div class="plates" id="plates"></div>
    </div>
  </section>

  <footer>
    <span><span data-name>Oohra</span> <span data-i="foot1"></span></span>
    <span data-i="foot2"></span>
  </footer>
</div>

<script>
/* ===== NASTAVENÍ / SETTINGS ===== */
var CONFIG={name:'Oohra',demo:'',discord:''};

/* Postup: váha = plánovaný počet týdnů, pct = kolik je hotovo (0 až 100). Uprav pct, mapa i pruh se přepočítají. */
var PHASES=[
 {k:'0',w:7,pct:100,st:'done',n:{cs:'Základ',en:'Foundation'},d:{cs:'Návrh, prototyp v prohlížeči, nástroje',en:'Design, browser prototype, tools'}},
 {k:'A',w:5,pct:5,st:'now',n:{cs:'Jádro hry',en:'Game core'},d:{cs:'Svět, rostliny, potřeby a otravy v C#, zatím v konzoli',en:'World, plants, needs and poison in C#, console only for now'}},
 {k:'B',w:5,pct:0,st:'next',n:{cs:'Svět v Unity',en:'World in Unity'},d:{cs:'Postava, kamera shora, první obraz',en:'Character, top-down camera, first image'}},
 {k:'C',w:6,pct:0,st:'next',n:{cs:'Síť',en:'Network'},d:{cs:'Server a dva hráči, kteří se vidí',en:'A server and two players who can see each other'}},
 {k:'D',w:17,pct:0,st:'next',n:{cs:'Systémy',en:'Systems'},d:{cs:'Oheň, stavby, jazyk, zvířata, kmeny',en:'Fire, building, language, animals, tribes'}},
 {k:'E',w:5,pct:0,st:'next',n:{cs:'Provoz',en:'Operations'},d:{cs:'Ukládání světa, server, účty',en:'World saving, server, accounts'}},
 {k:'F',w:7,pct:0,st:'next',n:{cs:'Alfa',en:'Alpha'},d:{cs:'Prvních patnáct až dvacet testerů',en:'The first fifteen to twenty testers'}}
];

/* Zápisy: nový zápis přidej NA ZAČÁTEK seznamu. d je 'RRRR-MM-DD' nebo 'RRRR-MM'. img je volitelný obrázek (adresa souboru nebo data:). */
var POSTS=[
 {d:'2026-10-15',img:'',t:{cs:'Pradávní a Noví',en:'The Ancients and the Later-born'},b:{cs:'Do hry přibylo rozlišení dvou druhů lidí. První generace je robustní a odolná, ti, kdo se narodí později, jsou štíhlejší a učí se rychleji. Rozdíl se mění s každou generací.',en:'The game now tells two kinds of people apart. The first generation is sturdy and resilient; those born later are slimmer and learn faster. The gap shifts with each generation.'}},
 {d:'2026-10',img:'',t:{cs:'Hratelný prototyp',en:'A playable prototype'},b:{cs:'Ostrov se čtyřmi ročními obdobími, den a noc, oheň, zima, zvířata, jazyk ze slabik a značky na zemi. Běží v prohlížeči a slouží k ladění pravidel.',en:'An island with four seasons, day and night, fire, winter, animals, a language of syllables and marks on the ground. It runs in a browser and exists to tune the rules.'}},
 {d:'2026-10',img:'',t:{cs:'Nejdřív bez soubojů hráčů',en:'No player fights at first'},b:{cs:'V prvním testu pro patnáct až dvacet lidí se hráči proti sobě bít nebudou. Důležitější je zjistit, jestli si lidé předávají znalosti a vracejí se.',en:'In the first test for fifteen to twenty people, players will not fight each other. What matters more is whether people pass knowledge on and come back.'}}
];

var NOTES={cs:['Nalezeno na kameni u pobřeží. Pod značkou byl popel a tři rozbité skořápky. Někdo tu seděl dlouho.','Vyrytá do hlíny kousek od potoka. Kdo ji kreslil, spěchal: čáry jsou hluboké a na konci se zlomily.','Stála na zdi opuštěného úkrytu, zevnitř. Někdo ji tam nechal, aby ji viděl ten, kdo přijde po něm.','Čtvrtá značka je nejmenší. Byla u ohniště, které ještě hřálo, ale nikdo kolem nebyl.'],

/* ===== POMOCNÉ ===== */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function bitsForShape(shape){
  var b='',x,y;
  for(y=0;y<12;y++)for(x=0;x<12;x++){
    var dx=x-5.5,dy=y-5.5,rr=Math.hypot(dx,dy),on=false;
    if(shape===0){var a=Math.atan2(dy,dx);on=(rr<1.5)||(rr<5.3&&rr>1.9&&Math.cos(a*4)>.15)}
    else if(shape===1){on=(Math.abs(dx+.5)<.8)||(y>1&&y<10&&Math.abs(Math.abs(dx+.5)-(10-y)*.42)<.85&&rr<6.2)}
    else if(shape===2){on=(Math.hypot(dx+2.3,dy+1.4)<2.6)||(Math.hypot(dx-2.3,dy+1.4)<2.6)||(dy>0&&dy<5.2&&Math.abs(dx)<(5.4-dy)*.8)}
    else{on=(dy>-5&&dy<5&&Math.abs(dx)<(dy+5.4)*.45)}
    b+=on?'1':'0';
  }
  return b;
}
function signSvg(shape,fill){
  var bits=bitsForShape(shape),r='';
  for(var i=0;i<144;i++)if(bits.charAt(i)==='1')r+='<rect x="'+(i%12)+'" y="'+Math.floor(i/12)+'" width="1.03" height="1.03"/>';
  return '<svg viewBox="0 0 12 12" fill="'+fill+'" shape-rendering="crispEdges" aria-hidden="true">'+r+'</svg>';
}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}

/* ===== VYKRESLENÍ TEXTŮ ===== */
function fmtDate(d){
  var p=d.split('-'),loc=LANG==='cs'?'cs-CZ':'en-GB';
  try{
    if(p.length===3)return new Date(+p[0],+p[1]-1,+p[2]).toLocaleDateString(loc,{day:'numeric',month:'long',year:'numeric'});
    return new Date(+p[0],+p[1]-1,1).toLocaleDateString(loc,{month:'long',year:'numeric'});
  }catch(e){return d}
}
var PCT=0;
function overall(){var tw=0,dn=0;PHASES.forEach(function(p){tw+=p.w;dn+=p.w*p.pct/100});return Math.round(dn/tw*1000)/10}
function render(){
  var T=I18N[LANG];
  document.documentElement.lang=LANG;
  document.querySelectorAll('[data-i]').forEach(function(e){var k=e.getAttribute('data-i');if(T[k]!==undefined&&typeof T[k]==='string')e.textContent=T[k]});
  document.getElementById('h1').innerHTML=T.h1;
  try{if(matchMedia('(hover: none)').matches)document.querySelector('.hint').textContent=T.hint_touch}catch(e){}
  document.querySelectorAll('.lang button').forEach(function(b){b.setAttribute('aria-pressed',b.getAttribute('data-lang')===LANG?'true':'false')});
  document.title=CONFIG.name;
  var h='';T.rules.forEach(function(r){h+='<div class="it"><h3>'+esc(r[0])+'</h3><p>'+esc(r[1])+'</p></div>'});
  document.getElementById('rules').innerHTML=h;
  document.getElementById('listA').innerHTML=T.A.map(function(x){return '<li>'+esc(x)+'</li>'}).join('');
  document.getElementById('listB').innerHTML=T.B.map(function(x){return '<li>'+esc(x)+'</li>'}).join('');
  /* značky */
  var g='';for(var i=0;i<4;i++)g+='<div class="gl">'+signSvg(i,'var(--fg)').replace('<svg ','<svg role="img" aria-label="'+T.sign+' '+(i+1)+'" ')+'<div class="mono">'+T.sign+' '+(i+1)+'</div><details><summary>'+T.where+'</summary><p>'+esc(NOTES[LANG][i])+'</p></details></div>';
  document.getElementById('glyphs').innerHTML=g;
  /* zápisy */
  var l='<article class="entry empty"><div class="mono">···</div><div class="tx"><h3>'+esc(T.next_entry)+'</h3></div></article>';
  POSTS.forEach(function(p){l+='<article class="entry"><div class="mono">'+esc(fmtDate(p.d))+'</div><div class="tx"><h3>'+esc(p.t[LANG])+'</h3><p>'+esc(p.b[LANG])+'</p>'+(p.img?'<img src="'+esc(p.img)+'" alt="">':'')+'</div></article>'});
  document.getElementById('log').innerHTML=l;
  /* fragmenty */
  var pl='';
  for(var n=0;n<Math.max(SLOTS,IMAGES.length);n++){
    var im=IMAGES[n];
    pl+=im?'<figure class="plate"><div class="fr"><img src="'+esc(im.src)+'" alt="'+esc(im[LANG])+'"></div><figcaption>'+esc(im[LANG])+'</figcaption></figure>'
          :'<figure class="plate"><div class="fr">'+signSvg(n%4,'var(--fg)')+'</div><figcaption class="mono">'+esc(T.empty)+'</figcaption></figure>';
  }
  document.getElementById('plates').innerHTML=pl;
  /* postup */
  PCT=overall();
  document.getElementById('pct').textContent=Math.round(PCT)+' %';
  var sg='',sl='',rd='',tw=0;PHASES.forEach(function(p){tw+=p.w});
  PHASES.forEach(function(p){
    sg+='<div class="seg" style="flex:'+p.w+'"><i style="width:'+p.pct+'%"></i></div>';
    sl+='<span style="flex:'+p.w+'">'+p.k+'</span>';
    rd+='<li class="'+p.st+'"><span class="k">'+p.k+'</span><span class="t"><b style="font-weight:500">'+esc(p.n[LANG])+'</b><small>'+esc(p.d[LANG])+'</small></span><span class="s">'+T['st_'+p.st]+(p.pct>0&&p.pct<100?' · '+p.pct+' %':'')+'</span></li>';
  });
  var sgEl=document.getElementById('segs');sgEl.innerHTML=sg;sgEl.setAttribute('aria-label',T.aria_prog(Math.round(PCT)));
  document.getElementById('segl').innerHTML=sl;
  document.getElementById('road').innerHTML=rd;
  drawMap();
}
document.querySelectorAll('[data-name]').forEach(function(e){e.textContent=CONFIG.name});

/* ===== MAPA VE MLZE ===== */
var MW=72,MH=36,MAP=null;
function buildMap(){
  var r=mulberry32(20261015),N=[];
  function noise(sx,sy,seed){
    var rr=mulberry32(seed),g=[],gx=Math.ceil(MW/sx)+2,gy=Math.ceil(MH/sy)+2,i;
    for(i=0;i<gx*gy;i++)g.push(rr());
    return function(x,y){
      var fx=x/sx,fy=y/sy,ix=Math.floor(fx),iy=Math.floor(fy),tx=fx-ix,ty=fy-iy;
      tx=tx*tx*(3-2*tx);ty=ty*ty*(3-2*ty);
      var a=g[iy*gx+ix],b=g[iy*gx+ix+1],c=g[(iy+1)*gx+ix],d=g[(iy+1)*gx+ix+1];
      return a+(b-a)*tx+(c-a)*ty+(a-b-c+d)*tx*ty;
    };
  }
  var n1=noise(11,11,3),n2=noise(5,5,9),n3=noise(3,3,17),cells=[],x,y,land=[];
  for(y=0;y<MH;y++)for(x=0;x<MW;x++){
    var dx=(x-MW/2)/(MW*.46),dy=(y-MH/2)/(MH*.46),rad=Math.pow(Math.hypot(dx,dy),1.7);
    var e=n1(x,y)*.55+n2(x,y)*.25+n3(x,y)*.1+.18-rad*.62;
    cells.push({e:e,v:r(),k:0});
  }
  var best=1e9,cx=MW/2,cy=MH/2,camp=null;
  for(y=0;y<MH;y++)for(x=0;x<MW;x++){var c=cells[y*MW+x];if(c.e>.5&&c.e<.62){var dd=Math.hypot(x-MW*.5,y-MH*.52);if(dd<best){best=dd;camp=[x,y]}}}
  if(!camp)camp=[MW>>1,MH>>1];
  for(y=0;y<MH;y++)for(x=0;x<MW;x++){var c2=cells[y*MW+x];c2.k=Math.hypot((x-camp[0])*.78,(y-camp[1])*1.5)+c2.v*3.2;if(c2.e>.42)land.push(c2.k)}
  land.sort(function(a,b){return a-b});
  return {cells:cells,camp:camp,land:land};
}
function drawMap(){
  if(!MAP)MAP=buildMap();
  var cv=document.getElementById('map'),c=cv.getContext('2d'),S=10;
  cv.width=MW*S;cv.height=MH*S;
  var share=Math.max(0,Math.min(1,PCT/100));
  var idx=Math.min(MAP.land.length-1,Math.round(share*MAP.land.length));
  var T=share<=0?-1:MAP.land[Math.max(0,idx-1)];
  var pal={deep:cssVar('--m-deep'),shallow:cssVar('--m-shallow'),sand:cssVar('--m-sand'),grass:cssVar('--m-grass'),forest:cssVar('--m-forest'),rock:cssVar('--m-rock'),fog:cssVar('--m-fog'),fog2:cssVar('--m-fog2')};
  for(var y=0;y<MH;y++)for(var x=0;x<MW;x++){
    var cell=MAP.cells[y*MW+x],col,e=cell.e,vis=cell.k<=T;
    if(!vis){col=cell.v>.55?pal.fog2:pal.fog;c.fillStyle=col;c.fillRect(x*S,y*S,S,S);
      if(cell.k<=T+2.2){c.globalAlpha=.35;c.fillStyle=e<.30?pal.deep:e<.42?pal.shallow:e<.48?pal.sand:e<.62?pal.grass:e<.74?pal.forest:pal.rock;c.fillRect(x*S,y*S,S,S);c.globalAlpha=1}
      continue}
    col=e<.30?pal.deep:e<.42?pal.shallow:e<.48?pal.sand:e<.62?pal.grass:e<.74?pal.forest:pal.rock;
    c.fillStyle=col;c.fillRect(x*S,y*S,S,S);
    if(cell.v>.82){c.globalAlpha=.18;c.fillStyle='#000';c.fillRect(x*S,y*S,S,S);c.globalAlpha=1}
  }
  /* tábor */
  var cx=MAP.camp[0]*S,cy=MAP.camp[1]*S;
  c.fillStyle=cssVar('--lichen');c.fillRect(cx+S*.25,cy+S*.25,S*.5,S*.5);
  c.globalAlpha=.35;c.fillRect(cx-S*.5,cy-S*.5,S*2,S*2);c.globalAlpha=1;
  document.getElementById('map').setAttribute('aria-label',I18N[LANG].aria_prog(Math.round(PCT)));
}
try{matchMedia('(prefers-color-scheme: light)').addEventListener('change',function(){setTimeout(drawMap,30)})}catch(e){}
new MutationObserver(function(){setTimeout(drawMap,30)}).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});

/* ===== MLHA A POCHODEŇ ===== */
(function(){
  var cv=document.getElementById('fog'),c=cv.getContext('2d'),W=0,H=0,CS=14,cols=0,rows=0,dpr=1,t0=0;
  var still=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  var mx=.7,my=.28,tx=.7,ty=.28,lastMove=-1e9,ghosts=[],colM='#2b3a33',colG='#b8c64c',lastCol=0;
  function hash(x,y){var h=Math.imul(x|0,374761393)+Math.imul(y|0,668265263);h=Math.imul(h^h>>>13,1274126177);return((h^h>>>16)>>>0)/4294967296}
  function vn(x,y){var ix=Math.floor(x),iy=Math.floor(y),fx=x-ix,fy=y-iy;fx=fx*fx*(3-2*fx);fy=fy*fy*(3-2*fy);
    var a=hash(ix,iy),b=hash(ix+1,iy),c2=hash(ix,iy+1),d=hash(ix+1,iy+1);return a+(b-a)*fx+(c2-a)*fy+(a-b-c2+d)*fx*fy}
  function size(){
    dpr=1;W=Math.max(1,innerWidth);H=Math.max(1,innerHeight);cv.width=W;cv.height=H;
    CS=W<640?12:14;cols=Math.ceil(W/CS);rows=Math.ceil(H/CS);
    var r=mulberry32(77),n=W<640?10:20;ghosts=[];
    for(var i=0;i<n;i++)ghosts.push({s:SYL[Math.floor(r()*SYL.length)],x:r(),y:r(),z:46+r()*70,a:.2+r()*.5});
  }
  function colors(){colM=cssVar('--mist')||colM;colG=cssVar('--ghost')||colG}
  var lastDraw=0;
  function frame(ts){
    if(!still&&ts-lastDraw<30){requestAnimationFrame(frame);return}
    lastDraw=ts;
    var t=ts/1000;
    if(ts-lastCol>1500){colors();lastCol=ts}
    if(!still){
      if(ts-lastMove>3500){tx=.5+Math.cos(t*.23)*.34;ty=.45+Math.sin(t*.31)*.28}
      mx+=(tx-mx)*.06;my+=(ty-my)*.06;
    }
    var px=mx*W,py=my*H,R=Math.min(W,H)*.34+40;
    c.clearRect(0,0,W,H);
    c.fillStyle=colM;
    for(var y=0;y<rows;y++)for(var x=0;x<cols;x++){
      var n=vn(x*.11+t*.035,y*.13-t*.02)*.6+vn(x*.27-t*.05,y*.29+t*.03)*.4;
      var dx=(x*CS+CS/2-px),dy=(y*CS+CS/2-py),d=Math.sqrt(dx*dx+dy*dy)/R;
      var clear=d>=1?1:d*d*(3-2*d);
      var a=Math.max(0,n-.32)*.55*clear;
      a=Math.round(a*7)/7;
      if(a>0.02){c.globalAlpha=a;c.fillRect(x*CS,y*CS,CS-1,CS-1)}
    }
    c.globalAlpha=1;
    /* pochodeň */
    var g=c.createRadialGradient(px,py,0,px,py,R*.9);
    g.addColorStop(0,colG);g.addColorStop(1,'rgba(0,0,0,0)');
    c.globalAlpha=.07;c.fillStyle=g;c.fillRect(px-R,py-R,R*2,R*2);c.globalAlpha=1;
    /* skryté slabiky */
    c.fillStyle=colG;c.textBaseline='middle';
    for(var i=0;i<ghosts.length;i++){
      var gh=ghosts[i],gx=gh.x*W,gy=gh.y*H,gd=Math.hypot(gx-px,gy-py)/(R*.95),al=gd>=1?0:(1-gd)*(1-gd)*gh.a*.55;
      if(al>.01){c.globalAlpha=al;c.font='500 '+Math.round(gh.z)+'px "IBM Plex Mono",ui-monospace,monospace';c.fillText(gh.s,gx,gy)}
    }
    c.globalAlpha=1;
    if(!still)requestAnimationFrame(frame);
  }
  size();
  window.addEventListener('resize',function(){size();if(still)frame(0)});
  window.addEventListener('pointermove',function(e){tx=e.clientX/W;ty=e.clientY/H;lastMove=performance.now()},{passive:true});
  if(still){colors();frame(0)}else requestAnimationFrame(frame);
})();

render();
</script>
